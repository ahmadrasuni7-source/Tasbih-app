name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          if [ -d audio ]; then cp -r audio www/; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><application#' android/app/src/main/AndroidManifest.xml
      - run: |
          mkdir -p android/app/src/main/java/com/ahmad/tasbih
          cp MainActivity.java android/app/src/main/java/com/ahmad/tasbih/MainActivity.java
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tasbih-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
