<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasbih Digital 3D</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#070f24"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--a:#070f24;--b:#1f3a78;--ac:#ffd27a;--tx:#f4f1e8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,var(--b),var(--a));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{text-align:center;padding:14px 16px 0}
#ar{font-size:30px;line-height:1.4;font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;color:var(--ac)}
#lt{font-size:14px;opacity:.8}
#cnt{text-align:center;margin-top:4px}
#n{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--ac)}
#of{display:block;font-size:13px;opacity:.75}
#bar{height:4px;margin:8px 32px 0;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
canvas{flex:1;min-height:0;width:100%;touch-action:manipulation;cursor:pointer}
#hint{text-align:center;font-size:12px;opacity:.55;margin-bottom:4px}
nav{display:flex;gap:10px;padding:8px 16px 14px;justify-content:center}
button{font:inherit;color:var(--tx);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 18px;cursor:pointer}
button:active{transform:scale(.96)}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:rgba(9,13,28,.94);backdrop-filter:blur(14px);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s;z-index:5}
#sheet.open{transform:none}
h3{font-size:13px;margin:16px 0 8px;opacity:.7;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;font-size:14px}
.chip.on{background:var(--ac);color:#111;border-color:var(--ac)}
input,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 12px;min-width:0}
select option{color:#111}
.f{display:flex;gap:8px;margin-top:8px}.f input{flex:1}
input[type=range]{width:100%;padding:0;accent-color:var(--ac)}
</style></head><body>
<header><div id="ar"></div><div id="lt"></div></header>
<div id="cnt"><span id="n">0</span><span id="of"></span></div>
<div id="bar"><i id="fill"></i></div>
<canvas id="cv"></canvas>
<div id="hint">Ketuk layar untuk menghitung · geser untuk memutar sudut 3D</div>
<nav><button id="undo">↩ Undo</button><button id="rst">Reset</button><button id="set">⚙ Pengaturan</button></nav>
<section id="sheet">
<div class="f" style="margin:0"><b style="flex:1;font-size:18px">Pengaturan</b><button id="close">Tutup</button></div>
<h3>Tema latar</h3><div class="row" id="c-th"></div>
<h3>Posisi tasbih</h3><div class="row" id="c-ly"></div>
<h3>Bentuk objek (manik, bintang, hati, dll)</h3><div class="row" id="c-sh"></div>
<h3>Warna manik</h3><div class="row" id="c-bc"></div>
<h3>Target dzikir</h3><div class="row" id="c-tg"></div>
<div class="f"><input id="tgi" type="number" min="1" placeholder="Target sendiri, mis. 250"><button id="tgb">Atur</button></div>
<h3>Pilihan dzikir</h3><div class="f" style="margin:0"><select id="dz" style="flex:1"></select><button id="del">Hapus</button></div>
<div class="f"><input id="nd" placeholder="Tambah dzikir baru…"><button id="add">Tambah</button></div>
<h3>Suara tasbih</h3><div class="row" id="c-sn"></div>
<h3>Suara latar alam</h3><div class="row" id="c-am"></div><input id="avl" type="range" min="0" max="1" step="0.05" style="margin-top:10px">
<h3>Ucapan suara (voice)</h3><div class="row" id="c-vo"></div>
<h3>Volume</h3><input id="vol" type="range" min="0" max="1" step="0.05">
</section>
<script>
const $=s=>document.querySelector(s);
const TH=[["Malam","#070f24","#1f3a78","#ffd27a"],["Hutan","#06201a","#1f6b4f","#f2d98a"],["Samudra","#02222e","#0e7c8f","#b8f1ff"],["Fajar","#2a1034","#c2587a","#ffe3a3"],["Gurun","#3b2410","#b8742f","#fff1c9"],["Hitam","#000000","#1c1c22","#e5e5e5"]];
const BC=[["Emas","#ffe9a8","#9a6a00"],["Zamrud","#9af0c4","#0b6b45"],["Rubi","#ffb0b8","#8d1030"],["Mutiara","#ffffff","#8a8fa3"],["Obsidian","#8a8a98","#101018"]];
const DEF=[{ar:"سُبْحَانَ اللّٰهِ",t:"Subhanallah"},{ar:"اَلْحَمْدُ لِلّٰهِ",t:"Alhamdulillah"},{ar:"اللّٰهُ أَكْبَرُ",t:"Allahu Akbar"},{ar:"أَسْتَغْفِرُ اللّٰهَ",t:"Astaghfirullah"},{ar:"لَا إِلٰهَ إِلَّا اللّٰهُ",t:"La ilaha illallah"},{ar:"اللّٰهُمَّ صَلِّ عَلَى مُحَمَّدٍ",t:"Allahumma shalli ala Muhammad"}];
const LY=[["ring","Lingkaran"],["line","Lurus"],["helix","Spiral"]];
const SH=["Bulat","Lonjong","Permata","Bintang","Hati","Bulan sabit","Daun"];
const SN=[["air","Tetes air"],["piano","Piano tenang"],["bowl","Mangkuk"],["wood","Kayu"],["bell","Lonceng"],["off","Hening"]];
const VO=[["off","Mati"],["each","Tiap hitungan"],["end","Saat target"]];
let S={th:0,ly:"ring",sh:0,bc:0,tg:33,dz:0,snd:"air",vo:"off",n:0,r:0,vol:.7,amb:"off",avol:.5,custom:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("tasbih")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("tasbih",JSON.stringify(S))}catch(e){}};
const list=()=>[...DEF,...S.custom];
const cur=()=>list()[S.dz]||list()[0];

/* audio */
let AC,MG;
function au(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination)}if(AC.state==="suspended")AC.resume();MG.gain.value=S.vol;return AC}
function tone(f,t0,type,g,dur,f2){const o=AC.createOscillator(),e=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur*.4);e.gain.setValueAtTime(.0001,t0);e.gain.exponentialRampToValueAtTime(g,t0+.01);e.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(e);e.connect(MG);o.start(t0);o.stop(t0+dur+.05)}
const SND={
air(t){tone(1400,t,"sine",.5,.3,420);tone(2100,t+.02,"sine",.12,.15,800)},
piano(t){const f=[261.6,293.7,329.6,392,440,523.3,587.3][S.n%7];tone(f,t,"triangle",.4,1.6);tone(f*2,t,"sine",.12,1)},
bowl(t){tone(220,t,"sine",.4,3);tone(222,t,"sine",.3,3);tone(594,t,"sine",.1,2)},
wood(t){tone(520,t,"sine",.5,.12,180)},
bell(t){[880,1320,1760].forEach((f,i)=>tone(f,t,"sine",.25/(i+1),1.2))}};
function play(){if(S.snd==="off")return;au();SND[S.snd](AC.currentTime)}
function say(){if(!("speechSynthesis" in window))return;const d=cur();let txt=d.ar||d.t,ar=/[\u0600-\u06FF]/.test(txt);
 if(ar&&!speechSynthesis.getVoices().some(v=>/^ar/i.test(v.lang))){txt=d.t;ar=false}
 const u=new SpeechSynthesisUtterance(txt);u.lang=ar?"ar-SA":"id-ID";u.rate=.85;u.volume=S.vol;speechSynthesis.cancel();speechSynthesis.speak(u)}
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* suara latar */
const AMB=[["off","Tanpa latar"],["rain","Hujan"],["wave","Ombak"],["wind","Angin"],["river","Sungai"]];
let NB={},AM=null;
function nbuf(w){if(!NB[w]){const b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=b.getChannelData(0);let q=0;for(let i=0;i<d.length;i++){const x=Math.random()*2-1;q=(q+.02*x)/1.02;d[i]=w?x*.5:q*3.5}NB[w]=b}return NB[w]}
function stopAmb(){if(!AM)return;AM.n.forEach(n=>{try{n.stop()}catch(e){}});clearInterval(AM.t);try{AM.g.disconnect()}catch(e){}AM=null}
function startAmb(){stopAmb();if(S.amb==="off")return;au();
 const g=AC.createGain();g.gain.value=S.avol;g.connect(AC.destination);
 const src=AC.createBufferSource();src.loop=true;const w=S.amb==="rain"||S.amb==="river";src.buffer=nbuf(w);
 const f=AC.createBiquadFilter(),m=AC.createGain(),L=AC.createOscillator(),lg=AC.createGain();AM={g,n:[src,L],t:0};
 L.connect(lg);
 if(S.amb==="rain"){f.type="highpass";f.frequency.value=1000;m.gain.value=.5;
  AM.t=setInterval(()=>{if(Math.random()<.5)tone(1500+Math.random()*2500,AC.currentTime,"sine",.04,.08,600)},220)}
 else if(S.amb==="wave"){f.type="lowpass";f.frequency.value=700;m.gain.value=.5;L.frequency.value=.11;lg.gain.value=.4;lg.connect(m.gain)}
 else if(S.amb==="wind"){f.type="bandpass";f.frequency.value=500;f.Q.value=.8;m.gain.value=.9;L.frequency.value=.07;lg.gain.value=250;lg.connect(f.frequency)}
 else{f.type="bandpass";f.frequency.value=1400;f.Q.value=.6;m.gain.value=.7;L.frequency.value=.4;lg.gain.value=.15;lg.connect(m.gain)}
 src.connect(f);f.connect(m);m.connect(g);src.start();L.start()}

/* counting */
let tp=0,pos=0;
function tap(){if(S.amb!=="off"&&!AM)startAmb();S.n++;tp++;play();vib(8);
 if(S.tg&&S.n>=S.tg){S.n=0;S.r++;vib([80,60,80]);if(S.snd!=="off"){au();tone(528,AC.currentTime+.1,"sine",.4,3)}if(S.vo!=="off")say()}
 else if(S.vo==="each")say();
 ui();save()}
function ui(){const d=cur();$("#ar").textContent=d.ar||d.t;$("#lt").textContent=d.ar?d.t:"";
 $("#n").textContent=S.n;$("#of").textContent=(S.tg?"dari "+S.tg:"tanpa batas")+(S.r?" · putaran ke-"+(S.r+1):"");
 $("#fill").style.width=(S.tg?S.n/S.tg*100:0)+"%"}
function theme(){const t=TH[S.th],r=document.documentElement.style;r.setProperty("--a",t[1]);r.setProperty("--b",t[2]);r.setProperty("--ac",t[3])}

/* canvas 3D */
const cv=$("#cv"),ctx=cv.getContext("2d");let cw=0,ch=0,yaw=0,yawT=0;
function size(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();cw=r.width;ch=r.height;cv.width=cw*d;cv.height=ch*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",size);
function path(x,y,r){ctx.beginPath();const s=S.sh;
 if(s===0)ctx.arc(x,y,r,0,7);else if(s===1)ctx.ellipse(x,y,r*.8,r*1.2,0,0,7);
 else if(s===2){ctx.moveTo(x,y-r*1.25);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r*1.25);ctx.lineTo(x-r,y);ctx.closePath()}
 else if(s===3){for(let i=0;i<10;i++){const a=-1.5708+i*.6283,q=i%2?r*.55:r*1.3;ctx[i?"lineTo":"moveTo"](x+q*Math.cos(a),y+q*Math.sin(a))}ctx.closePath()}
 else if(s===4){ctx.moveTo(x,y+r*.95);ctx.bezierCurveTo(x-r*1.5,y-r*.1,x-r*.8,y-r*1.2,x,y-r*.45);ctx.bezierCurveTo(x+r*.8,y-r*1.2,x+r*1.5,y-r*.1,x,y+r*.95);ctx.closePath()}
 else if(s===5){ctx.arc(x,y,r*1.1,-2.3,2.3,false);ctx.quadraticCurveTo(x+r*.4,y,x+r*1.1*Math.cos(-2.3),y+r*1.1*Math.sin(-2.3));ctx.closePath()}
 else{ctx.moveTo(x,y-r*1.4);ctx.quadraticCurveTo(x+r*1.3,y-r*.2,x,y+r*1.4);ctx.quadraticCurveTo(x-r*1.3,y-r*.2,x,y-r*1.4);ctx.closePath()}}
function bead(x,y,r,shade,glow){const c=BC[S.bc];path(x,y,r);
 const g=s=>{const q=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.2);q.addColorStop(0,c[1]);q.addColorStop(1,c[2]);return q};
 ctx.shadowBlur=glow?26:0;ctx.shadowColor=TH[S.th][3];ctx.fillStyle=g();ctx.fill();ctx.shadowBlur=0;
 ctx.fillStyle="rgba(0,0,0,"+shade+")";ctx.fill();
 ctx.beginPath();ctx.arc(x-r*.35,y-r*.4,r*.16,0,7);ctx.fillStyle="rgba(255,255,255,.55)";ctx.fill()}
function draw(){
 pos+=(tp-pos)*.16;yaw+=(yawT-yaw)*.1;ctx.clearRect(0,0,cw,ch);
 const ly=S.ly,N=S.tg>0?Math.min(S.tg,150):33,cx=cw/2,cy=ch*(ly==="ring"?.46:.5);let P=[],R,gap,f,Zs,rb;
 if(ly==="ring"){R=Math.min(cw*.36,ch*.4);f=R*3.2;Zs=R;rb=Math.min(R*.1,6.2832*R/N*.42)}
 else if(ly==="line"){gap=Math.min(ch/8,cw*.2);f=gap*12;Zs=gap*1.5;rb=gap*.4}
 else{R=cw*.26;gap=ch/15;f=cw*2;Zs=R;rb=gap*.38}
 for(let i=0;i<N;i++){let k=i-pos;k=((k+N/2)%N+N)%N-N/2;let x,y,z;
  if(ly==="ring"){const t=k/N*6.2832;x=R*Math.sin(t);z=R*Math.cos(t);y=z*.38}
  else if(ly==="line"){y=k*gap;x=Math.sin(k*.5)*gap*.25;z=Zs-Math.abs(k)*gap*.2}
  else{const t=k*.55;x=R*Math.sin(t);z=R*Math.cos(t);y=k*gap}
  const xx=x*Math.cos(yaw)+z*Math.sin(yaw),zz=-x*Math.sin(yaw)+z*Math.cos(yaw),sc=f/(f-zz);
  P.push({k,sx:cx+xx*sc,sy:cy+y*sc,r:rb*sc,z:zz,sh:Math.max(0,Math.min(.62,(1.1-zz/Zs)*.26))})}
 ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=2;ctx.beginPath();
 for(let i=0;i<N;i++){const a=P[i],b=P[(i+1)%N];if(ly==="ring"||Math.abs(a.k-b.k)<1.5){ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy)}}
 ctx.stroke();
 [...P].sort((a,b)=>a.z-b.z).forEach(p=>{
  ctx.beginPath();ctx.ellipse(p.sx,p.sy+p.r*1.5,p.r*.8,p.r*.25,0,0,7);ctx.fillStyle="rgba(0,0,0,.18)";ctx.fill();
  bead(p.sx,p.sy,p.r,p.sh,Math.abs(p.k)<.5)});
 requestAnimationFrame(draw)}
cv.addEventListener("pointerdown",tap);
cv.addEventListener("pointermove",e=>{yawT=((e.clientX/cw)-.5)*.9});
cv.addEventListener("pointerleave",()=>yawT=0);

/* settings UI */
function chips(id,items,get,set){const e=$(id);e.innerHTML="";items.forEach((x,i)=>{const b=document.createElement("button");b.className="chip"+(get(i)?" on":"");b.textContent=Array.isArray(x)?x[x.length>2?0:1]:x;b.onclick=()=>{set(i);chips(id,items,get,set)};e.appendChild(b)})}
function build(){
 chips("#c-th",TH,i=>S.th===i,i=>{S.th=i;theme();save()});
 chips("#c-ly",LY,i=>S.ly===LY[i][0],i=>{S.ly=LY[i][0];save()});
 chips("#c-sh",SH,i=>S.sh===i,i=>{S.sh=i;save()});
 chips("#c-bc",BC,i=>S.bc===i,i=>{S.bc=i;save()});
 const T=[33,99,100,1000,0];
 chips("#c-tg",T.map(x=>x||"Bebas"),i=>S.tg===T[i],i=>{S.tg=T[i];S.n=0;ui();save()});
 chips("#c-sn",SN,i=>S.snd===SN[i][0],i=>{S.snd=SN[i][0];save();play()});
 chips("#c-am",AMB,i=>S.amb===AMB[i][0],i=>{S.amb=AMB[i][0];startAmb();save()});
 chips("#c-vo",VO,i=>S.vo===VO[i][0],i=>{S.vo=VO[i][0];save();if(S.vo!=="off")say()});
 $("#dz").innerHTML=list().map((d,i)=>"<option value='"+i+"'>"+d.t+"</option>").join("");$("#dz").value=S.dz}
$("#dz").onchange=e=>{S.dz=+e.target.value;S.n=0;ui();save()};
$("#add").onclick=()=>{const v=$("#nd").value.trim();if(!v)return;S.custom.push({ar:/[\u0600-\u06FF]/.test(v)?v:"",t:v});S.dz=list().length-1;$("#nd").value="";S.n=0;build();ui();save()};
$("#del").onclick=()=>{const i=S.dz-DEF.length;if(i<0)return;S.custom.splice(i,1);S.dz=0;build();ui();save()};
$("#tgb").onclick=()=>{const v=parseInt($("#tgi").value);if(v>0){S.tg=v;S.n=0;$("#tgi").value="";build();ui();save()}};
$("#vol").value=S.vol;$("#vol").oninput=e=>{S.vol=+e.target.value;if(MG)MG.gain.value=S.vol;save()};
$("#avl").value=S.avol;$("#avl").oninput=e=>{S.avol=+e.target.value;if(AM)AM.g.gain.value=S.avol;save()};
$("#set").onclick=()=>$("#sheet").classList.add("open");
$("#close").onclick=()=>$("#sheet").classList.remove("open");
$("#rst").onclick=()=>{S.n=0;S.r=0;ui();save()};
$("#undo").onclick=()=>{if(S.n>0){S.n--;tp--;ui();save()}};
theme();build();ui();size();draw();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
