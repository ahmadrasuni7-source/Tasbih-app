<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasbih Digital 3D</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#070f24"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--a:#070f24;--b:#1f3a78;--ac:#ffd27a;--tx:#f4f1e8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,var(--b),var(--a));color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{text-align:center;padding:14px 16px 0}
#ar{font-size:30px;line-height:1.4;font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;color:var(--ac)}
#lt{font-size:14px;opacity:.8}
#cnt{text-align:center;margin-top:4px}
#n{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--ac)}
#of{display:block;font-size:13px;opacity:.75}
#bar{height:4px;margin:8px 32px 0;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;touch-action:none;cursor:pointer}
header,#cnt,#bar,#hint{position:relative;z-index:1;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.55)}
#hint{margin-top:auto}#qs,nav{position:relative;z-index:1}
#qs{display:flex;gap:6px;padding:0 12px 6px;justify-content:center}#qs select{flex:1;min-width:0;font-size:13px;padding:8px 10px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
@keyframes sh{0%,100%{transform:translate(0)}20%{transform:translate(-9px,3px)}40%{transform:translate(9px,-3px)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,-2px)}}.shake{animation:sh .45s 2}
#hint{text-align:center;font-size:12px;opacity:.55;margin-bottom:4px}
nav{display:flex;gap:10px;padding:8px 16px 14px;justify-content:center}
button{font:inherit;color:var(--tx);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:10px 18px;cursor:pointer}
button:active{transform:scale(.96)}
nav button{padding:9px 13px;font-size:14px}#au.on{background:var(--ac);color:#111;border-color:var(--ac)}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:rgba(9,13,28,.94);backdrop-filter:blur(14px);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s;z-index:5}
#sheet.open{transform:none}
h3{font-size:13px;margin:16px 0 8px;opacity:.7;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;font-size:14px}
.chip.on{background:var(--ac);color:#111;border-color:var(--ac)}
input,select{font:inherit;color:var(--tx);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 12px;min-width:0}
select option{color:#111}
.f{display:flex;gap:8px;margin-top:8px}.f input{flex:1}
input[type=range]{width:100%;padding:0;accent-color:var(--ac)}
</style></head><body>
<header><div id="ar"></div><div id="lt"></div></header>
<div id="cnt"><span id="n">0</span><span id="of"></span></div>
<div id="bar"><i id="fill"></i></div>
<canvas id="cv"></canvas>
<div id="hint">Ketuk atau tarik layar · keyboard: Spasi, Enter, ↑</div>
<div id="qs"><select id="qsn"></select><select id="qvo"></select><select id="qam"></select></div>
<nav><button id="undo">↩ Undo</button><button id="rst">Reset</button><button id="au">▶ Auto</button><button id="set">⚙ Pengaturan</button></nav>
<section id="sheet">
<div class="f" style="margin:0"><b style="flex:1;font-size:18px">Pengaturan</b><button id="close">Tutup</button></div>
<h3>Tema objek</h3><div class="row" id="c-ob"></div>
<div id="sec-kl"><h3>Tema latar (khusus Klasik)</h3><div class="row" id="c-th"></div>
<h3>Posisi tasbih</h3><div class="row" id="c-ly"></div>
<h3>Warna manik</h3><div class="row" id="c-bc"></div></div>
<h3>Target dzikir</h3><div class="row" id="c-tg"></div>
<div class="f"><input id="tgi" type="number" min="1" placeholder="Target sendiri, mis. 250"><button id="tgb">Atur</button></div>
<h3>Pilihan dzikir</h3><div class="f" style="margin:0"><select id="dz" style="flex:1"></select><button id="del">Hapus</button></div>
<div class="f"><input id="nd" placeholder="Tambah dzikir baru…"><button id="add">Tambah</button></div>
<h3>Volume suara latar</h3><input id="avl" type="range" min="0" max="1" step="0.05" style="margin-top:10px">
<h3>Suara pembaca</h3><div class="f" style="margin:0"><select id="vc" style="flex:1"></select><button id="vt">Tes suara</button></div><div id="vst" style="font-size:13px;opacity:.7;margin-top:6px"></div>
<h3>Mode Auto (jalan sendiri)</h3><div class="row" id="c-av"></div><div id="gpl" style="font-size:13px;opacity:.7;margin:10px 0 4px"></div><input id="gp" type="range" min="0.5" max="8" step="0.5">
<h3>Getar saat target</h3><div class="row" id="c-vb"></div>
<h3>Volume</h3><input id="vol" type="range" min="0" max="1" step="0.05">
</section>
<script>
const $=s=>document.querySelector(s);
const TH=[["Malam","#070f24","#1f3a78","#ffd27a"],["Hutan","#06201a","#1f6b4f","#f2d98a"],["Samudra","#02222e","#0e7c8f","#b8f1ff"],["Fajar","#2a1034","#c2587a","#ffe3a3"],["Gurun","#3b2410","#b8742f","#fff1c9"],["Hitam","#000000","#1c1c22","#e5e5e5"],["Hitam Pekat","#000000","#000000","#ffd27a"]];
const BC=[["Emas","#ffe9a8","#9a6a00"],["Zamrud","#9af0c4","#0b6b45"],["Rubi","#ffb0b8","#8d1030"],["Mutiara","#ffffff","#8a8fa3"],["Obsidian","#8a8a98","#101018"]];
const DEF=[{ar:"سُبْحَانَ اللّٰهِ",t:"Subhanallah"},{ar:"اَلْحَمْدُ لِلّٰهِ",t:"Alhamdulillah"},{ar:"اللّٰهُ أَكْبَرُ",t:"Allahu Akbar"},{ar:"أَسْتَغْفِرُ اللّٰهَ",t:"Astaghfirullah"},{ar:"لَا إِلٰهَ إِلَّا اللّٰهُ",t:"La ilaha illallah"},{ar:"اللّٰهُمَّ صَلِّ عَلَى مُحَمَّدٍ",t:"Allahumma shalli ala Muhammad"}];
const LY=[["ring","Lingkaran"],["fullring","Lingkaran Penuh"],["vring","Lingkaran Vertikal"],["line","Lurus"],["side","Samping"]];
const OB=[["0","Klasik"],["1","Dial Teks"],["2","Air Sumur"],["3","Pohon Tumbuh"],["4","Matahari Terbit"]];
const SN=[["air","Tetes air"],["piano","Piano tenang"],["bowl","Mangkuk"],["wood","Kayu"],["bell","Lonceng"],["off","Hening"]];
const VO=[["off","Mati"],["each","Tiap hitungan"],["end","Saat target"]];
let S={th:0,ly:"ring",sh:0,bc:0,tg:33,dz:0,snd:"air",vo:"off",n:0,r:0,vol:.7,amb:"off",avol:.5,ob:0,gp:2,av:true,vc:"",vb:true,custom:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("tasbih")||"{}"))}catch(e){}
if(S.ob>4||S.ob<0)S.ob=0;
const save=()=>{try{localStorage.setItem("tasbih",JSON.stringify(S))}catch(e){}};
const list=()=>[...DEF,...S.custom];
const cur=()=>list()[S.dz]||list()[0];

/* audio */
let AC,MG;
function au(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination)}if(AC.state==="suspended")AC.resume();MG.gain.value=S.vol;return AC}
function tone(f,t0,type,g,dur,f2){const o=AC.createOscillator(),e=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur*.4);e.gain.setValueAtTime(.0001,t0);e.gain.exponentialRampToValueAtTime(g,t0+.01);e.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(e);e.connect(MG);o.start(t0);o.stop(t0+dur+.05)}
const SND={
air(t){tone(1400,t,"sine",.5,.3,420);tone(2100,t+.02,"sine",.12,.15,800)},
piano(t){const f=[261.6,293.7,329.6,392,440,523.3,587.3][S.n%7];tone(f,t,"triangle",.4,1.6);tone(f*2,t,"sine",.12,1)},
bowl(t){tone(220,t,"sine",.4,3);tone(222,t,"sine",.3,3);tone(594,t,"sine",.1,2)},
wood(t){tone(520,t,"sine",.5,.12,180)},
bell(t){[880,1320,1760].forEach((f,i)=>tone(f,t,"sine",.25/(i+1),1.2))}};
function play(){if(S.snd==="off")return;au();SND[S.snd](AC.currentTime)}
function fillV(){const e=$("#vc");if(!e)return;const v=("speechSynthesis" in window)?[...speechSynthesis.getVoices()]:[];const A=x=>/^ar/i.test(x.lang)?1:0,I=x=>/^id/i.test(x.lang)?1:0;
 v.sort((a,b)=>(A(b)-A(a))||(I(b)-I(a)));
 e.innerHTML="<option value=''>Otomatis</option>"+v.map(x=>"<option value='"+x.voiceURI+"'>"+x.name+" ("+x.lang+")</option>").join("");e.value=S.vc;
 $("#vst").textContent=v.length?(v.some(A)?"Suara Arab tersedia di perangkat ini.":"Tidak ada suara Arab di perangkat, jadi dzikir dibaca versi Latin."):"Perangkat belum menyediakan suara pembaca."}
function tts(d,fin){if(!("speechSynthesis" in window)){fin();return}const vs=speechSynthesis.getVoices();
 const vo=vs.find(x=>x.voiceURI===S.vc)||vs.find(x=>/^ar/i.test(x.lang)&&d.ar)||vs.find(x=>/^id/i.test(x.lang))||vs[0];
 const ar=!!vo&&/^ar/i.test(vo.lang)&&!!d.ar,u=new SpeechSynthesisUtterance(ar?d.ar:d.t);
 if(vo){u.voice=vo;u.lang=vo.lang}else u.lang="id-ID";u.rate=.85;u.volume=S.vol;u.onend=u.onerror=fin;window._u=u;
 if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u)}
function say(cb){let c=0,t=0;const fin=()=>{if(!c){c=1;cb&&cb()}},go=d=>{if(!t){t=1;tts(d,fin)}};
 const d=cur(),a=new Audio("audio/"+d.t.toLowerCase().replace(/[^a-z]/g,"")+".mp3");a.volume=S.vol;a.onended=fin;a.onerror=()=>go(d);a.play().catch(()=>go(d));setTimeout(fin,9000)}
const vib=p=>{if(!S.vb)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* suara latar */
const AMB=[["off","Tanpa latar"],["rain","Hujan"],["wave","Ombak"],["wind","Angin"],["river","Sungai"]];
let NB={},AM=null;
function nbuf(w){if(!NB[w]){const b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate),d=b.getChannelData(0);let q=0;for(let i=0;i<d.length;i++){const x=Math.random()*2-1;q=(q+.02*x)/1.02;d[i]=w?x*.5:q*3.5}NB[w]=b}return NB[w]}
function stopAmb(){if(!AM)return;AM.n.forEach(n=>{try{n.stop()}catch(e){}});clearInterval(AM.t);try{AM.g.disconnect()}catch(e){}AM=null}
function startAmb(){stopAmb();if(S.amb==="off")return;au();
 const g=AC.createGain();g.gain.value=S.avol;g.connect(AC.destination);
 const src=AC.createBufferSource();src.loop=true;const w=S.amb==="rain"||S.amb==="river";src.buffer=nbuf(w);
 const f=AC.createBiquadFilter(),m=AC.createGain(),L=AC.createOscillator(),lg=AC.createGain();AM={g,n:[src,L],t:0};
 L.connect(lg);
 if(S.amb==="rain"){f.type="highpass";f.frequency.value=1000;m.gain.value=.5;
  AM.t=setInterval(()=>{if(Math.random()<.5)tone(1500+Math.random()*2500,AC.currentTime,"sine",.04,.08,600)},220)}
 else if(S.amb==="wave"){f.type="lowpass";f.frequency.value=700;m.gain.value=.5;L.frequency.value=.11;lg.gain.value=.4;lg.connect(m.gain)}
 else if(S.amb==="wind"){f.type="bandpass";f.frequency.value=500;f.Q.value=.8;m.gain.value=.9;L.frequency.value=.07;lg.gain.value=250;lg.connect(f.frequency)}
 else{f.type="bandpass";f.frequency.value=1400;f.Q.value=.6;m.gain.value=.7;L.frequency.value=.4;lg.gain.value=.15;lg.connect(m.gain)}
 src.connect(f);f.connect(m);m.connect(g);src.start();L.start()}

/* counting */
let tp=0,pos=0;
let auto=0,aT=0;
function setAuto(on){auto=on;clearTimeout(aT);try{speechSynthesis.cancel()}catch(e){}$("#au").textContent=on?"⏸ Stop":"▶ Auto";$("#au").classList.toggle("on",!!on);if(on){au();autoLoop()}}
function autoLoop(){if(!auto)return;tap(true);if(!auto)return;const go=()=>{if(auto)aT=setTimeout(autoLoop,S.gp*1000)};S.av?say(go):go()}
function tap(a){if(S.amb!=="off"&&!AM)startAmb();S.n++;tp++;play();vib(8);FX.push(performance.now());if(S.ob===2)DR.push(performance.now());
 if(S.tg&&S.n>=S.tg){S.n=0;S.r++;vib([250,100,250,100,500]);shake();if(S.snd!=="off"){au();tone(528,AC.currentTime+.1,"sine",.4,3)}if(auto)setAuto(0);if(S.vo!=="off"||a)say()}
 else if(S.vo==="each"&&!a)say();
 ui();save()}
function shake(){[cv,$("#cnt")].forEach(e=>{e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")})}
function ui(){const d=cur();$("#ar").textContent=d.ar||d.t;$("#lt").textContent=d.ar?d.t:"";
 $("#n").textContent=S.n;$("#of").textContent=(S.tg?"dari "+S.tg:"tanpa batas")+(S.r?" · putaran ke-"+(S.r+1):"");
 $("#fill").style.width=(S.tg?S.n/S.tg*100:0)+"%"}
function theme(){const t=TH[S.th],r=document.documentElement.style;r.setProperty("--a",t[1]);r.setProperty("--b",t[2]);r.setProperty("--ac",t[3])}
 
/* canvas 3D */
const cv=$("#cv"),ctx=cv.getContext("2d");let cw=0,ch=0,FH=0,ay=0,DP=1,GS=44,yaw=0,yawT=0,drag=0,ST=[],FX=[],DR=[];
for(let i=0;i<90;i++)ST.push([Math.random(),Math.random(),Math.random()*6.3,.6+Math.random()*1.4]);
function size(){DP=devicePixelRatio||1;const r=cv.getBoundingClientRect();cw=r.width;FH=r.height;cv.width=cw*DP;cv.height=FH*DP}
function area(){ay=$("#bar").getBoundingClientRect().bottom+6;ch=Math.max(160,$("#hint").getBoundingClientRect().top-ay)}
function LG(st,y0=-ay,y1=FH-ay){const g=ctx.createLinearGradient(0,y0,0,y1);st.forEach(([o,c])=>g.addColorStop(o,c));return g}
addEventListener("resize",size);
const mix=(a,b,t)=>a+(b-a)*t;
function mixc(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)),A=p(a),B=p(b);return"rgb("+A.map((v,i)=>Math.round(mix(v,B[i],t))).join(",")+")"}
const prog=()=>Math.min(1,S.tg?S.n/S.tg:(S.n%100)/100);
function stars(a,t){ST.forEach(s=>{ctx.globalAlpha=a*(.45+.55*Math.sin(t/600+s[2]));ctx.fillStyle="#fff";ctx.fillRect(s[0]*cw,s[1]*FH-ay,s[3],s[3])});ctx.globalAlpha=1}
function bead(x,y,r,shade,glow,c){c=c||BC[S.bc];const q=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r*1.2);q.addColorStop(0,c[1]);q.addColorStop(1,c[2]);
 ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.shadowBlur=glow?26:0;ctx.shadowColor=TH[S.th][3];ctx.fillStyle=q;ctx.fill();ctx.shadowBlur=0;
 if(shade){ctx.fillStyle="rgba(0,0,0,"+shade+")";ctx.fill()}
 ctx.beginPath();ctx.arc(x-r*.35,y-r*.4,r*.16,0,7);ctx.fillStyle="rgba(255,255,255,.55)";ctx.fill()}
function tassel(x,y,r){ctx.strokeStyle="#e8b84a";ctx.lineWidth=2;ctx.beginPath();[-r,0,r].forEach(d=>{ctx.moveTo(x,y);ctx.lineTo(x+d*.9,y+r*4)});ctx.stroke();bead(x,y,r*.7,0,0,["","#ffe9a8","#9a6a00"])}
function beads(ly,cx,cy,w,h,c,M0){
 const R=Math.min(w*.36,h*.4),RV=Math.min(h*.4,w*.46),M=ly==="ring"||ly==="vring"?M0:Math.max(M0,22);let f,Zs,rb,gap;
 if(ly==="ring"){f=R*3.2;Zs=R;rb=Math.min(R*.1,6.2832*R/M*.42)}
 else if(ly==="vring"){f=RV*3.2;Zs=RV*.78;rb=Math.min(RV*.1,6.2832*RV/M*.42);GS=6.2832*RV/M}
 else if(ly==="line"){gap=Math.min(h/8,w*.2);f=gap*12;Zs=gap*1.5;rb=gap*.4}
 else{gap=w/11;f=gap*12;Zs=gap*1.5;rb=gap*.42}
 const P=[];
 for(let i=0;i<M;i++){let k=i-pos;k=((k+M/2)%M+M)%M-M/2;let x,y,z;const t=k/M*6.2832;
  if(ly==="ring"){x=R*Math.sin(t);z=R*Math.cos(t);y=z*.38}
  else if(ly==="vring"){const q=t+1.5708,x0=RV*Math.cos(q);x=x0*.62;z=x0*.78;y=RV*Math.sin(q)}
  else if(ly==="line"){y=k*gap;x=Math.sin(k*.5)*gap*.25;z=Zs-Math.abs(k)*gap*.2}
  else{x=k*gap;y=x*x/(w*.9);z=Zs-Math.abs(k)*gap*.15}
  const xx=x*Math.cos(yaw)+z*Math.sin(yaw),zz=-x*Math.sin(yaw)+z*Math.cos(yaw),sc=f/(f-zz);
  P.push({k,sx:cx+xx*sc,sy:cy+y*sc,r:rb*sc,z:zz,sh:Math.max(0,Math.min(.62,(1.1-zz/Zs)*.26))})}
 ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=2;ctx.beginPath();
 for(let i=0;i<M;i++){const a=P[i],b=P[(i+1)%M];if(ly==="ring"||ly==="vring"||Math.abs(a.k-b.k)<1.5){ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy)}}ctx.stroke();
 [...P].sort((a,b)=>a.z-b.z).forEach(p=>{ctx.beginPath();ctx.ellipse(p.sx,p.sy+p.r*1.5,p.r*.8,p.r*.25,0,0,7);ctx.fillStyle="rgba(0,0,0,.18)";ctx.fill();bead(p.sx,p.sy,p.r,p.sh,Math.abs(p.k)<.5,c)});
 if(ly==="ring"){const q=P.reduce((a,b)=>Math.abs(a.k)<Math.abs(b.k)?a:b);tassel(q.sx,q.sy+q.r*1.6,q.r*.9)}}
function fullring(){const cx=cw/2,cy=ch*.5,R=Math.min(cw*.4,ch*.4),n=Math.min(S.tg||100,150),rb=Math.min(R*.05,6.2832*R/n*.42),m=S.n%n;
 for(let i=0;i<n;i++){const a=i/n*6.2832;bead(cx+R*Math.sin(a),cy-R*Math.cos(a),rb,0,i===m-1,i<m?["","#fff2c4","#d89a00"]:["","#6b7fae","#1b2850"])}
 tassel(cx,cy+R+rb*1.5,rb*1.4);ctx.fillStyle=TH[S.th][3];ctx.textAlign="center";ctx.font=R*.2+"px Amiri,serif";ctx.fillText(cur().ar||cur().t,cx,cy+R*.05);ctx.textAlign="left"}
function sunrise(t){const p=prog(),W=cw,H=ch,hy=H*.6,sx=W/2,r=W*.1,sy=hy+r*1.2-(hy-H*.2)*p;
 ctx.fillStyle=LG([[0,mixc("#0b1030","#4a90d9",p)],[1,mixc("#4a2a55","#ffd9a0",p)]],-ay,hy);ctx.fillRect(0,-ay,W,hy+ay);
 stars(Math.max(0,1-p*2.5),t);
 const g=ctx.createRadialGradient(sx,sy,0,sx,sy,W*.6);g.addColorStop(0,"rgba(255,200,110,"+(.3+.6*p)+")");g.addColorStop(1,"rgba(255,160,60,0)");ctx.fillStyle=g;ctx.fillRect(0,-ay,W,hy+ay);
 for(let i=0;i<3;i++){const x=((t*.012*(i+1)+i*200)%(W+240))-120,y=H*(.14+i*.1);ctx.fillStyle="rgba(255,"+(i?255:235)+","+(i?255:220)+","+(.25+.25*p)+")";[[0,0,60,16],[-30,6,40,12],[34,5,44,12]].forEach(([a,b,c,d])=>{ctx.beginPath();ctx.ellipse(x+a,y+b,c,d,0,0,7);ctx.fill()})}
 ctx.save();ctx.beginPath();ctx.rect(0,-ay,W,hy+ay);ctx.clip();ctx.translate(sx,sy);ctx.rotate(t*.0002);ctx.strokeStyle="rgba(255,230,160,"+.25*p+")";ctx.lineWidth=3;
